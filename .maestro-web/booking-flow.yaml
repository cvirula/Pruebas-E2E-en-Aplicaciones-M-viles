url: http://localhost:8081
name: BDD web - Reservar y cancelar una cita
tags:
  - smoke
  - booking
  - gherkin
properties:
  bddFeature: "Agendamiento y gestión de citas"
  bddScenario: "Reservar y cancelar una cita correctamente"
---
- launchApp
- assertVisible: "Agendar ahora"
- tapOn:
    id: "book-primary"
- assertVisible: "¿Qué necesitas?"
- tapOn:
    id: "service-consulta"
- tapOn:
    id: "booking-next"
- assertVisible: "Elige a tu especialista"
- tapOn:
    id: "professional-sofia"
- tapOn:
    id: "booking-next"
- assertVisible: "¿Cuándo te queda bien?"
- tapOn:
    id: "date-2"
- tapOn:
    id: "time-1030"
- tapOn:
    id: "booking-next"
- assertVisible: "Revisa tu cita"
- assertVisible: "Sofía Herrera"
- assertVisible: "10:30"
- tapOn:
    id: "confirm-booking"
- assertVisible: "¡Tu cita está lista!"
- tapOn:
    id: "view-appointment"
- assertVisible: "Consulta general"
- tapOn:
    id: "cancel-appointment"
- assertVisible:
    id: "cancelled-appointment"
- takeScreenshot: "reserva-web-cancelada"
